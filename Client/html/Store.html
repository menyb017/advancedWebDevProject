    <!-- newsletterModal -->
    <div id="newsletter-modal" class="modal">
      <div class="modal-content">
          <span class="close">&times;</span>
          <h2>Sign up for the H&M newsletter</h2>
          <p>Sign up for the H&M newsletter and you will receive all discount to your mail.</p>
          <form id="newsletter-form">
            <label id="labelEmail"for="inputEmail" class="ltr-label">Email address:</label>
            <input type="email"  id="inputEmail" name="email" required/>

            <label id="labelCountry" for="country-code">Select a country:</label>
            <select id="country-code" name="country-code" required>
              <option value="+972">Israel (+972)</option>
              <option value="+1">United States (+1)</option>
              <option value="+44">UK (+44)</option>
              <option va.lue="+33">France (+33)</option>
            </select>
            <label id="labelPhone"for="inputPhone">Phone number:</label>
            <input type="tel" id="inputPhone" id="phone"name="phone"requiredplaceholder="Enter a phone number"/>
            <label id="labelBirth" for="inputBirthday">Date of birth:</label>
            <input id="inputBirthday"type="date"id="birthdate"name="birthdate"/>
            <button id="buttonSub" type="submit">Register now</button>
          </form>
      </div>
